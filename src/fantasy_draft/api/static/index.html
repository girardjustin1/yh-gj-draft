<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1117">
<title>Draft AI</title>
<style>
/* Mobile-first. You are on a 30-90 second clock, holding a phone, one-handed.
   The recommendation must be readable without scrolling; every action must sit in the
   lower-thumb zone; nothing important may hide behind a horizontal scroll.
   The layout widens to two and three columns on larger screens. */
:root{
  --bg:#0d1117; --panel:#161c24; --panel-2:#1d2530; --line:#2a323d; --line-2:#39424e;
  --text:#e9eff5; --dim:#93a1b0; --dimmer:#6e7b89;
  --accent:#4c9dfa; --good:#3fb950; --warn:#e3a72c; --bad:#f85149;
  --qb:#f0736a; --rb:#4bbf7a; --wr:#5aa9f5; --te:#c586e0;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.45 var(--sans);-webkit-text-size-adjust:100%}
body{padding-bottom:calc(78px + var(--safe-b))}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.wrap{max-width:1400px;margin:0 auto;padding:8px}

/* ---------- sticky context bar ---------- */
.topbar{position:sticky;top:0;z-index:30;background:rgba(13,17,23,.94);
  backdrop-filter:saturate(160%) blur(12px);border-bottom:1px solid var(--line);
  padding:8px 12px;display:flex;align-items:center;gap:10px}
.picknow{font-family:var(--mono);font-size:19px;font-weight:750;letter-spacing:-.5px;line-height:1}
.pickmeta{font-size:11px;color:var(--dim);margin-top:2px;white-space:nowrap}
.pickmeta b{color:var(--text)}
.topbar .grow{flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:999px;
  font-size:10.5px;background:var(--panel-2);border:1px solid var(--line);color:var(--dim);
  white-space:nowrap}
.chip.ok{color:var(--good);border-color:#22502e}
.chip.warn{color:var(--warn);border-color:#5c4a1a}
.chip.bad{color:var(--bad);border-color:#5c2626}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.iconbtn{width:38px;height:38px;border-radius:10px;background:var(--panel-2);
  border:1px solid var(--line);display:grid;place-items:center;font-size:16px;flex:none}
.iconbtn:active{background:var(--line)}

/* ---------- panels ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  overflow:hidden;margin-top:10px}
.card>h2{margin:0;padding:9px 13px;font-size:10.5px;letter-spacing:.85px;
  text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--line);font-weight:700;
  display:flex;align-items:center;gap:8px}
.card>h2 .n{width:17px;height:17px;border-radius:5px;background:var(--panel-2);
  display:grid;place-items:center;font-size:10px;color:var(--dim)}
.card>.body{padding:13px}
.card.hero{border-color:#2f5480;background:linear-gradient(180deg,#18222f,#161c24)}

/* ---------- 1. the recommendation ---------- */
.recname{font-size:27px;font-weight:800;letter-spacing:-.7px;line-height:1.1}
.recsub{color:var(--dim);font-size:12.5px;margin-top:4px;display:flex;gap:7px;
  align-items:center;flex-wrap:wrap}
.posdot{display:inline-block;padding:1.5px 7px;border-radius:5px;font-size:10.5px;
  font-weight:800;color:#08121c;letter-spacing:.3px}
.pos-QB{background:var(--qb)}.pos-RB{background:var(--rb)}
.pos-WR{background:var(--wr)}.pos-TE{background:var(--te)}
.pos-K,.pos-DST{background:var(--dimmer)}
.statrow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:13px}
.statbox{background:var(--panel-2);border-radius:10px;padding:8px 4px;text-align:center}
.statbox .v{font-family:var(--mono);font-size:19px;font-weight:750;line-height:1.15}
.statbox .k{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.4px;
  margin-top:3px;line-height:1.2}
.reason{margin-top:12px;font-size:13px;line-height:1.6;color:#c5d2de}
.reason.collapsed{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;
  overflow:hidden}
.morebtn{margin-top:6px;font-size:12px;color:var(--accent);font-weight:600}
.altrow{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.altchip{padding:6px 10px;border-radius:9px;background:var(--panel-2);
  border:1px solid var(--line);font-size:12.5px;display:flex;gap:6px;align-items:center}
.altchip b{font-family:var(--mono)}

/* ---------- positional value bars (from the reference app) ---------- */
.vorlegend{font-size:10.5px;color:var(--dim);display:flex;justify-content:space-between;
  margin-bottom:9px}
.vorrow{display:grid;grid-template-columns:34px 1fr auto;gap:9px;align-items:center;
  margin-bottom:7px}
.vorlabel{font-size:11px;font-weight:800;text-align:center;padding:3px 0;border-radius:6px;
  color:#08121c}
.vortrack{height:22px;background:var(--panel-2);border-radius:7px;overflow:hidden}
.vortrack>span{display:block;height:100%;border-radius:7px;transition:width .35s ease}
.vornum{font-family:var(--mono);font-size:12px;color:var(--dim);min-width:52px;text-align:right}

/* ---------- 4. survival ---------- */
.survrow{display:grid;grid-template-columns:1fr 44px;gap:10px;align-items:center;padding:7px 0}
.survrow+.survrow{border-top:1px solid #1d242d}
.survname{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.bar{height:6px;border-radius:3px;background:#242c36;overflow:hidden;margin-top:5px}
.bar>span{display:block;height:100%;border-radius:3px}
.survpct{font-family:var(--mono);font-size:14.5px;font-weight:750;text-align:right}

/* ---------- 5. what if ---------- */
.wi{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 11px;
  border-radius:11px;background:var(--panel-2);border:1px solid var(--line);margin-bottom:7px}
.wi.best{border-color:#2f6b3f;background:#152218}
.wi .n{font-weight:650;font-size:13.5px}
.wi .p{color:var(--dim);font-size:11px;font-family:var(--mono);margin-top:3px}
.wi .c{font-family:var(--mono);font-size:18px;font-weight:750;text-align:right}
.wi .d{font-size:10px;color:var(--dim);text-align:right}

/* ---------- 2. player list ---------- */
.tabs{display:flex;gap:4px;padding:9px 11px 0}
.tab2{flex:1;padding:8px 0;text-align:center;font-size:12.5px;font-weight:650;
  color:var(--dim);border-bottom:2px solid transparent}
.tab2.on{color:var(--text);border-bottom-color:var(--accent)}
.filters{display:flex;gap:6px;overflow-x:auto;padding:10px 11px;scrollbar-width:none;
  -webkit-overflow-scrolling:touch}
.filters::-webkit-scrollbar{display:none}
.pillbtn{padding:6px 13px;border-radius:999px;background:var(--panel-2);
  border:1px solid var(--line);color:var(--dim);font-size:12.5px;white-space:nowrap;flex:none}
.pillbtn.on{background:var(--accent);border-color:var(--accent);color:#06121f;font-weight:700}
.sortbar{display:flex;gap:8px;align-items:center;padding:0 11px 10px}
select{background:var(--panel-2);color:var(--text);border:1px solid var(--line);
  border-radius:9px;padding:7px 9px;font-size:12.5px;flex:1;min-width:0}

.plist{list-style:none;margin:0;padding:0}
.prow{position:relative;overflow:hidden;border-top:1px solid #1c232c}
.pinner{display:grid;grid-template-columns:1fr auto auto;gap:9px;align-items:center;
  padding:10px 11px;background:var(--panel);transition:transform .18s ease;
  touch-action:pan-y}
.pmain{min-width:0}
.pname{font-size:14.5px;font-weight:650;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.pmeta{font-size:11px;color:var(--dim);margin-top:3px;display:flex;gap:6px;align-items:center}
.pnums{text-align:right;font-family:var(--mono);line-height:1.25}
.pnums .a{font-size:15px;font-weight:750}
.pnums .b{font-size:10.5px;color:var(--dim)}
.gonebadge{min-width:44px;text-align:center;font-family:var(--mono);font-size:12.5px;
  font-weight:750;padding:5px 4px;border-radius:8px;background:var(--panel-2)}
.swipehint{position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-end;
  padding-right:16px;background:linear-gradient(90deg,transparent,#5c2626);
  font-size:12px;font-weight:700;color:#ffd9d9;pointer-events:none;opacity:0}
.prow.armed .swipehint{opacity:1}
.prow.taken .pinner{opacity:.4}

/* ---------- what you still need ---------- */
.needrow{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;
  padding:9px 10px;border-radius:10px;margin-bottom:6px;background:var(--panel-2)}
.needrow.open{border-left:3px solid var(--warn)}
.needrow.done{opacity:.5}
.needslot{font-family:var(--mono);font-size:10.5px;font-weight:750;color:var(--dim);
  text-align:center}
.needname{font-size:13.5px;font-weight:650;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.needmeta{font-size:10.5px;color:var(--dim);margin-top:2px}
.neednum{font-family:var(--mono);text-align:right}
.neednum .u{font-size:14px;font-weight:750}
.neednum .g{font-size:10px;color:var(--dim)}

/* ---------- 3. roster ---------- */
.slot{display:grid;grid-template-columns:48px 1fr;gap:9px;align-items:center;
  padding:8px 10px;border-radius:9px;margin-bottom:5px;background:var(--panel-2)}
.slot.empty{background:transparent;border:1px dashed var(--line-2)}
.slot .lbl{font-family:var(--mono);font-size:10.5px;color:var(--dim);font-weight:700;
  text-align:center}
.slot.empty .who{color:var(--dimmer);font-style:italic;font-size:13px}

/* ---------- bottom action bar ---------- */
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:40;
  padding:9px 12px calc(9px + var(--safe-b));
  background:rgba(13,17,23,.96);backdrop-filter:saturate(160%) blur(14px);
  border-top:1px solid var(--line);display:flex;gap:9px}
#clockBtn{flex:1;background:var(--accent);color:#06121f;border-radius:13px;
  padding:15px;font-weight:800;letter-spacing:.4px;font-size:15px}
#clockBtn:active{transform:scale(.985)}
#clockBtn:disabled{opacity:.5}
#undoBtn{width:56px;border-radius:13px;background:var(--panel-2);
  border:1px solid var(--line);font-size:13px;font-weight:650}

/* ---------- misc ---------- */
.note{margin-top:9px;padding:9px 11px;border-radius:10px;background:#1e1b12;
  border:1px solid #3f3619;color:#dccd93;font-size:12px;line-height:1.55}
.note.err{background:#2a1315;border-color:#5c2626;color:#f2bcbc}
.empty{padding:26px 13px;text-align:center;color:var(--dim);font-size:13px}
.muted{color:var(--dim);font-size:11.5px}
.toast{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(92px + var(--safe-b));z-index:60;
  background:var(--panel-2);border:1px solid var(--line-2);border-radius:11px;
  padding:11px 16px;font-size:13px;font-weight:600;box-shadow:0 8px 26px rgba(0,0,0,.5);
  opacity:0;pointer-events:none;transition:opacity .18s;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ---------- wider screens ---------- */
@media(min-width:760px){
  .wrap{padding:12px}
  body{padding-bottom:16px}
  .actionbar{position:sticky;top:0;bottom:auto;background:none;backdrop-filter:none;
    border:0;border-radius:0;padding:0;margin-top:10px}
  #clockBtn{padding:13px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
  .grid2>.card{margin-top:10px}
  .recname{font-size:32px}
}
@media(min-width:1120px){
  .grid3{display:grid;grid-template-columns:1.15fr 1fr;gap:10px;align-items:start}
  .grid3>.card{margin-top:10px}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="grow">
    <div class="picknow" id="pickNow">—</div>
    <div class="pickmeta" id="pickMeta">press analyse to begin</div>
  </div>
  <span class="chip" id="providerChip"><span class="dot"></span><span>…</span></span>
  <button class="iconbtn" id="refreshBtn" title="Re-analyse">↻</button>
</div>

<div class="wrap">
  <div id="alerts"></div>

  <div class="grid3">
    <section class="card hero">
      <h2><span class="n">1</span> On the clock</h2>
      <div class="body" id="clockBody">
        <div class="empty">Tap <b>ANALYSE PICK</b> below.</div>
      </div>
    </section>

    <section class="card">
      <h2>Positional value over replacement</h2>
      <div class="body" id="vorBody"><div class="empty">—</div></div>
    </section>
  </div>

  <section class="card" id="needsCard">
    <h2>What you still need</h2>
    <div class="body" id="needsBody"><div class="empty">—</div></div>
  </section>

  <div class="grid2">
    <section class="card">
      <h2><span class="n">4</span> Who makes it back to me?</h2>
      <div class="body" id="survivalBody"><div class="empty">—</div></div>
    </section>

    <section class="card">
      <h2><span class="n">5</span> What if I take…</h2>
      <div class="body" id="whatIfBody"><div class="empty">—</div></div>
    </section>
  </div>

  <section class="card">
    <h2><span class="n">2</span> Best available</h2>
    <div class="tabs" id="tabs"></div>
    <div class="filters" id="posFilters"></div>
    <div class="sortbar">
      <select id="sortSel">
        <option value="draft_now">Sort · Draft Now</option>
        <option value="player_score">Sort · Player Score</option>
        <option value="probability_gone">Sort · Most likely gone</option>
        <option value="vbd">Sort · VBD</option>
        <option value="adp">Sort · ADP</option>
        <option value="adp_value">Sort · ADP value</option>
        <option value="ceiling">Sort · Ceiling</option>
        <option value="floor">Sort · Floor</option>
        <option value="lineup_upgrade">Sort · Fills my lineup</option>
        <option value="projection">Sort · Projection</option>
      </select>
    </div>
    <ul class="plist" id="plist"><li class="empty">—</li></ul>
    <div class="body muted" id="listHint"></div>
  </section>

  <section class="card">
    <h2><span class="n">3</span> My roster</h2>
    <div class="body" id="rosterBody"><div class="empty">—</div></div>
  </section>

  <section class="card">
    <h2>Draft environment &amp; data health</h2>
    <div class="body" id="envBody"><div class="empty">—</div></div>
  </section>
</div>

<div class="actionbar">
  <button id="clockBtn">ANALYSE PICK</button>
  <button id="undoBtn" title="Undo last recorded pick">Undo</button>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const POSITIONS = ["ALL","QB","RB","WR","TE"];
const TABS = [["available","Available"],["roster","My team"],["gone","Drafted"]];
let LATEST=null, POS="ALL", SORT="draft_now", TAB="available", SELECTED=new Set(), BUSY=false;

const fmt=(v,d=1)=>(v==null)?"–":Number(v).toFixed(d);
const pct=(v)=>(v==null)?"–":Math.round(v*100)+"%";
const esc=(s)=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const posClass=(p)=>"pos-"+(["QB","RB","WR","TE"].includes(p)?p:"K");

/* Colour carries one meaning only: urgency. */
function urgency(gone){
  if(gone==null) return "var(--dimmer)";
  if(gone>=.7) return "var(--bad)";
  if(gone>=.4) return "var(--warn)";
  return "var(--good)";
}
function toast(msg){
  const t=$("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2200);
}
async function api(path,body){
  const res=await fetch(path, body?{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify(body)}:undefined);
  const text=await res.text();
  let data; try{data=JSON.parse(text);}catch{data={detail:text};}
  if(!res.ok) throw new Error(data.detail||data.error||("HTTP "+res.status));
  return data;
}
function alert_(html,cls="note"){ $("alerts").insertAdjacentHTML("beforeend",`<div class="${cls}">${html}</div>`); }

/* ---------- config ---------- */
async function loadConfig(){
  try{
    const c=await api("/api/config"), L=c.league, p=c.provider;
    const chip=$("providerChip");
    chip.className="chip "+(p.connected?"ok":(p.implemented?"warn":"bad"));
    chip.lastElementChild.textContent=p.platform;
    chip.title=p.detail;
    $("pickMeta").innerHTML=`${L.teams}-team ${esc(L.scoring_type)}${L.is_superflex?" SF":""} · slot <b>${L.slot??"?"}</b>`;
    if(!L.slot) alert_("<b>Draft slot not set.</b> Snake maths needs it — set <code>draft.slot</code> in <code>config/league.yaml</code> or run <code>ff draft sync</code>.");
    if(!p.implemented) alert_(esc(p.detail),"note err");
  }catch(e){ alert_("Config failed: "+esc(e.message),"note err"); }
}

/* ---------- 1 ---------- */
function renderClock(d){
  const o=d.on_the_clock, r=o.recommendation;
  $("pickNow").textContent=o.pick_label;
  $("pickMeta").innerHTML = o.next_pick_label
    ? `next <b>${esc(o.next_pick_label)}</b> · <b>${o.picks_until_next}</b> picks away`
    : "last pick of the draft";
  if(!r){ $("clockBody").innerHTML=`<div class="empty">No candidate could be scored.</div>`; return; }
  const gone=r.probability_gone;
  $("clockBody").innerHTML=`
    <div class="recname">${esc(r.name)}</div>
    <div class="recsub">
      <span class="posdot ${posClass(r.position)}">${esc(r.position)}</span>
      <span>${esc(r.team??"")}</span>${r.bye_week?`<span>· bye ${r.bye_week}</span>`:""}
      ${r.tier?`<span>· tier ${r.tier}</span>`:""}
      <span>· ${esc(o.strategy.current)}</span>
    </div>
    <div class="statrow">
      <div class="statbox"><div class="v">${fmt(r.draft_now)}</div><div class="k">Draft now</div></div>
      <div class="statbox"><div class="v">${fmt(r.player_score)}</div><div class="k">Player</div></div>
      <div class="statbox"><div class="v" style="color:${urgency(gone)}">${pct(gone)}</div><div class="k">Gone by next</div></div>
      <div class="statbox"><div class="v">${pct(o.confidence)}</div><div class="k">Confidence</div></div>
    </div>
    <div class="reason collapsed" id="reasonText">${esc(o.reason)}</div>
    <button class="morebtn" id="moreBtn">Why? ▾</button>
    ${o.alternatives.length?`<div class="altrow">${o.alternatives.map(a=>
      `<span class="altchip"><span class="posdot ${posClass(a.position)}">${esc(a.position)}</span>
       ${esc(a.name)} <b>${fmt(a.draft_now)}</b></span>`).join("")}</div>`:""}`;
  $("moreBtn").onclick=(e)=>{
    const t=$("reasonText"); const c=t.classList.toggle("collapsed");
    e.target.textContent=c?"Why? ▾":"Less ▴";
  };
}

/* ---------- positional value bars ---------- */
function renderVor(d){
  const env=d.draft_environment;
  const rows=["QB","RB","WR","TE"].filter(p=>env[p]);
  if(!rows.length){ $("vorBody").innerHTML=`<div class="empty">—</div>`; return; }
  const max=Math.max(...rows.map(p=>env[p].scarcity),1);
  $("vorBody").innerHTML=`
    <div class="vorlegend"><span>Based on who is left + your roster</span><span>LOW → HIGH</span></div>
    ${rows.map(p=>{
      const e=env[p], w=Math.max(4,Math.round(100*e.scarcity/max));
      return `<div class="vorrow">
        <div class="vorlabel ${posClass(p)}">${p}</div>
        <div class="vortrack"><span style="width:${w}%;background:var(--${p.toLowerCase()})"></span></div>
        <div class="vornum">${fmt(e.expected_gone_before_next_pick,1)} gone</div>
      </div>`;
    }).join("")}
    <div class="muted" style="margin-top:8px">Bar length is positional scarcity right now;
    the number is how many are expected to go before your next pick.</div>`;
}

/* ---------- what you still need ---------- */
function renderNeeds(d){
  const n=d.what_i_need;
  if(!n||!n.slots.length){ $("needsBody").innerHTML=`<div class="empty">—</div>`; return; }
  const open=n.unfilled;
  $("needsBody").innerHTML=
    (open.length
      ? `<div class="muted" style="margin-bottom:9px">Unfilled starting slots:
         <b style="color:var(--warn)">${open.join(", ")}</b></div>`
      : `<div class="muted" style="margin-bottom:9px">Every starting slot is filled — you are drafting depth.</div>`)
    + n.slots.map(s=>{
      const b=s.best;
      if(!b) return `<div class="needrow ${s.filled?"done":"open"}">
        <div class="needslot">${esc(s.slot)}</div>
        <div class="needname muted">nobody available</div><div></div></div>`;
      return `<div class="needrow ${s.filled?"done":"open"}">
        <div class="needslot">${esc(s.slot)}</div>
        <div>
          <div class="needname">${esc(b.name)}</div>
          <div class="needmeta"><span class="posdot ${posClass(b.position)}">${esc(b.position)}</span>
            ${esc(b.team??"")} · DN ${fmt(b.draft_now)}${b.tier?` · T${b.tier}`:""}</div>
        </div>
        <div class="neednum">
          <div class="u">+${fmt(b.lineup_upgrade,0)}</div>
          <div class="g" style="color:${urgency(b.probability_gone)}">${pct(b.probability_gone)} gone</div>
        </div>
      </div>`;
    }).join("")
    + `<div class="muted" style="margin-top:8px">
       <b>+N</b> is the value this player adds to your <i>starting lineup</i>, in VBD —
       so a fourth running back scores low once your RB and FLEX slots are full.
       Shown to inform the pick, not to override it: reaching for a hole is how drafts
       go wrong.</div>`;
}

/* ---------- 4 ---------- */
function renderSurvival(d){
  const rows=d.who_makes_it_back;
  if(!rows.length){ $("survivalBody").innerHTML=`<div class="empty">No next pick — last selection.</div>`; return; }
  $("survivalBody").innerHTML=rows.slice(0,8).map(r=>{
    const p=r.probability_available;
    return `<div class="survrow">
      <div>
        <div class="survname"><span class="posdot ${posClass(r.position)}">${esc(r.position)}</span>
          ${esc(r.name)}</div>
        <div class="bar"><span style="width:${Math.round(p*100)}%;background:${urgency(r.probability_gone)}"></span></div>
      </div>
      <div class="survpct" style="color:${urgency(r.probability_gone)}">${pct(p)}</div>
    </div>`;}).join("")+
    `<div class="muted" style="margin-top:9px">Chance still on the board at
     <b>${esc(d.on_the_clock.next_pick_label??"—")}</b>.</div>`;
}

/* ---------- 5 ---------- */
function renderWhatIf(d){
  const rows=d.what_if;
  if(!rows.length){ $("whatIfBody").innerHTML=`<div class="empty">Simulation off.</div>`; return; }
  $("whatIfBody").innerHTML=rows.map((r,i)=>`
    <div class="wi ${i===0?"best":""}">
      <div><div class="n">${esc(r.name)}</div>
        <div class="p">${fmt(r.value_now)} + ${fmt(r.expected_next_value)} → ${esc(r.likely_next_position??"?")}</div></div>
      <div><div class="c">${fmt(r.combined)}</div>
        <div class="d">${i===0?"best path":fmt(r.delta_vs_best)}</div></div>
    </div>`).join("")+
    `<div class="muted">This pick plus the best player expected to survive to your next one.</div>`;
}

/* ---------- 2 ---------- */
function renderTabs(){
  $("tabs").innerHTML=TABS.map(([k,l])=>`<button class="tab2 ${k===TAB?"on":""}" data-tab="${k}">${l}</button>`).join("");
  $("tabs").querySelectorAll(".tab2").forEach(b=>b.onclick=()=>{TAB=b.dataset.tab;renderTabs();renderList();});
  $("posFilters").innerHTML=POSITIONS.map(p=>`<button class="pillbtn ${p===POS?"on":""}" data-pos="${p}">${p}</button>`).join("");
  $("posFilters").querySelectorAll(".pillbtn").forEach(b=>b.onclick=()=>{POS=b.dataset.pos;renderTabs();renderList();});
}

function listRows(){
  if(!LATEST) return [];
  if(TAB==="roster"){
    const r=LATEST.my_roster;
    return [...r.starters,...r.bench].filter(s=>s.filled)
      .map(s=>({name:s.name,position:s.position,team:s.team,player_key:s.player_key,slot:s.slot}));
  }
  if(TAB==="gone") return (LATEST.draft.recent_positions?[]:[]);
  let rows=LATEST.best_available.slice();
  if(POS!=="ALL") rows=rows.filter(r=>r.position===POS);
  const asc = (SORT==="adp");
  rows.sort((a,b)=>{
    const x=a[SORT]??-Infinity, y=b[SORT]??-Infinity;
    return asc?(x-y):(y-x);
  });
  return rows;
}

function renderList(){
  const list=$("plist"), rows=listRows();
  if(TAB==="gone"){
    list.innerHTML=`<li class="empty">Drafted players are removed from the board automatically.</li>`;
    $("listHint").textContent=""; return;
  }
  if(!rows.length){ list.innerHTML=`<li class="empty">Nothing here yet.</li>`; return; }

  if(TAB==="roster"){
    list.innerHTML=rows.map(r=>`<li class="prow"><div class="pinner">
      <div class="pmain"><div class="pname">${esc(r.name)}</div>
        <div class="pmeta"><span class="posdot ${posClass(r.position)}">${esc(r.position)}</span>
          ${esc(r.team??"")} · ${esc(r.slot)}</div></div>
      <div></div><div></div></div></li>`).join("");
    $("listHint").textContent=""; return;
  }

  list.innerHTML=rows.slice(0,120).map(r=>`
    <li class="prow" data-key="${esc(r.player_key)}" data-name="${esc(r.name)}">
      <div class="swipehint">mark drafted</div>
      <div class="pinner">
        <div class="pmain">
          <div class="pname">${esc(r.name)}</div>
          <div class="pmeta">
            <span class="posdot ${posClass(r.position)}">${esc(r.position)}</span>
            <span>${esc(r.team??"")}</span>
            ${r.bye_week?`<span>bye ${r.bye_week}</span>`:""}
            ${r.tier?`<span>T${r.tier}</span>`:""}
            <span>${fmt(r.floor,0)}–${fmt(r.ceiling,0)}</span>
            ${r.lineup_upgrade!=null?`<span>+${fmt(r.lineup_upgrade,0)} lineup</span>`:""}
          </div>
        </div>
        <div class="pnums">
          <div class="a">${fmt(r.draft_now)}</div>
          <div class="b">ADP ${fmt(r.adp,1)}</div>
        </div>
        <div class="gonebadge" style="color:${urgency(r.probability_gone)}">${pct(r.probability_gone)}</div>
      </div>
    </li>`).join("");

  $("listHint").innerHTML="Swipe a row left to mark them drafted by someone else. "+
    "The <b>%</b> is the chance they are gone before your next pick.";
  attachSwipe();
}

/* Swipe-left to record a pick — the offline path, borrowed from the reference app and
   wired to the same manual-entry endpoint the CLI uses. */
function attachSwipe(){
  $("plist").querySelectorAll(".prow[data-key]").forEach(row=>{
    const inner=row.querySelector(".pinner");
    let x0=null,y0=null,dx=0,locked=null;
    inner.addEventListener("touchstart",e=>{
      x0=e.touches[0].clientX; y0=e.touches[0].clientY; dx=0; locked=null;
      inner.style.transition="none";
    },{passive:true});
    inner.addEventListener("touchmove",e=>{
      if(x0==null) return;
      const cx=e.touches[0].clientX-x0, cy=e.touches[0].clientY-y0;
      if(locked==null) locked = Math.abs(cx)>Math.abs(cy)+4 ? "x" : "y";
      if(locked!=="x") return;
      dx=Math.min(0,cx);
      inner.style.transform=`translateX(${dx}px)`;
      row.classList.toggle("armed", dx<-70);
    },{passive:true});
    inner.addEventListener("touchend",()=>{
      inner.style.transition="";
      if(locked==="x" && dx<-70) recordPick(row.dataset.key,row.dataset.name);
      inner.style.transform=""; row.classList.remove("armed"); x0=null;
    });
    // Desktop: click the % badge to record.
    row.querySelector(".gonebadge").onclick=()=>recordPick(row.dataset.key,row.dataset.name);
  });
}

async function recordPick(key,name){
  if(BUSY) return; BUSY=true;
  try{
    const d=await api("/api/pick",{player_key:key});
    toast(`${d.recorded.pick_label} · ${name}${d.is_my_pick?" — YOU'RE UP":""}`);
    await onClock(false);
  }catch(e){ toast(e.message.slice(0,90)); }
  finally{ BUSY=false; }
}

/* ---------- 3 ---------- */
function renderRoster(d){
  const r=d.my_roster;
  $("rosterBody").innerHTML =
    r.starters.map(s=>`<div class="slot ${s.filled?"":"empty"}">
      <div class="lbl">${esc(s.slot)}</div>
      <div class="who">${s.filled?esc(s.name)+` <span class="muted">${esc(s.team??"")}</span>`:"—"}</div>
    </div>`).join("")+
    (r.bench.length?`<div class="muted" style="margin:10px 0 6px">Bench</div>`+
      r.bench.map(s=>`<div class="slot"><div class="lbl">${esc(s.position??"BN")}</div>
      <div class="who">${esc(s.name)}</div></div>`).join(""):"")+
    `<div class="muted" style="margin-top:9px">${r.size} drafted ·
      ${r.unfilled_starters.length} slot(s) to fill</div>`;
}

/* ---------- env + health ---------- */
function renderEnv(d){
  const env=d.draft_environment;
  const rows=["QB","RB","WR","TE"].filter(p=>env[p]).map(p=>{
    const e=env[p];
    return `<div class="vorrow"><div class="vorlabel ${posClass(p)}">${p}</div>
      <div class="vortrack"><span style="width:${Math.round(e.demand)}%;background:var(--accent)"></span></div>
      <div class="vornum">${e.startable_available} left</div></div>`;
  }).join("");
  const stale=d.staleness.map(s=>`<span class="chip ${s.stale?"warn":"ok"}"><span class="dot"></span>${esc(s.source)}</span>`).join(" ");
  $("envBody").innerHTML=`<div class="muted" style="margin-bottom:8px">Room demand by position</div>${rows}
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:12px">${stale}</div>
    ${d.warnings.map(w=>`<div class="note">${esc(w)}</div>`).join("")}
    ${d.simulation?`<div class="muted" style="margin-top:9px">${d.simulation.iterations.toLocaleString()} simulations · seed ${d.simulation.seed}</div>`:""}`;
}

/* ---------- main ---------- */
async function onClock(showBusy=true){
  const btn=$("clockBtn");
  if(showBusy){ btn.disabled=true; btn.textContent="ANALYSING…"; }
  $("alerts").innerHTML="";
  try{
    const d=await api("/api/on-clock",{refresh:true,simulate:true,limit:140});
    LATEST=d;
    renderClock(d); renderVor(d); renderNeeds(d); renderSurvival(d); renderWhatIf(d);
    renderList(); renderRoster(d); renderEnv(d);
    if(d.sync_error) alert_(`Live sync did not run — using the stored board. <span class="muted">${esc(d.sync_error)}</span>`);
  }catch(e){
    alert_("<b>Could not analyse.</b><br>"+esc(e.message),"note err");
  }finally{ btn.disabled=false; btn.textContent="ANALYSE PICK"; }
}

$("clockBtn").onclick=()=>onClock();
$("refreshBtn").onclick=()=>onClock();
$("undoBtn").onclick=async()=>{
  try{ const d=await api("/api/undo",{});
    toast(d.removed?`Undid ${d.removed.name}`:"Nothing to undo");
    if(d.removed) await onClock(false);
  }catch(e){ toast(e.message.slice(0,90)); }
};
$("sortSel").onchange=e=>{SORT=e.target.value;renderList();};
renderTabs(); loadConfig();
</script>
</body>
